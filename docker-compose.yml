version: "3.8"

services:
  db:
    image: postgres:15
    container_name: teogeo-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env 에서 불러온 DB_* 값을 사용 (없으면 기본값 사용)
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-teogeo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: teogeo-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      # .env에서 불러온 값을 그대로 사용
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: teogeo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    container_name: teogeo-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A celery_app.celery_app worker --loglevel=info

  nginx:
    image: nginx:alpine
    container_name: teogeo-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:

