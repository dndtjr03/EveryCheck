version: "3.8"

services:
  db:
    image: postgres:15
    container_name: teogeo-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env 에서 불러온 DB_* 값을 사용 (없으면 기본값 사용)
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-teogeo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    # Dockerfile 이 `COPY backend/...` 와 `COPY static/` 를 쓰므로 컨텍스트는 repo 루트.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: teogeo-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    # env_file 만으로 모든 환경변수 주입됨 (중복 environment 블록 제거).
    # Nginx 가 web:8000 으로 내부 접근하므로 호스트 노출은 디버깅 시에만.
    # .env 에 WEB_HOST_PORT=8000 설정 시 호스트에서 직접 접근 가능.
    ports:
      - "${WEB_HOST_PORT:-127.0.0.1:8000}:8000"

  redis:
    image: redis:7-alpine
    container_name: teogeo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: teogeo-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A celery_app.celery_app worker --loglevel=info

  nginx:
    image: nginx:alpine
    container_name: teogeo-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:

