# Alembic configuration for EveryCheck backend.
# sqlalchemy.url is intentionally left blank; env.py resolves the URL at runtime
# from config.get_settings() (preferred) or DATABASE_URL env var (fallback).

[alembic]
# Path to migration scripts, relative to this file (run alembic from backend/).
script_location = alembic

# Template used to generate migration file names; include UTC timestamp.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps.
timezone = UTC

# Max length of slug field in file_template.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the versions/ directory.
sourceless = false

# Version path separator; defaults to os.pathsep.
version_path_separator = os

# Output encoding used when revision files are written.
output_encoding = utf-8

# Leave blank - env.py resolves the URL.
sqlalchemy.url =


[post_write_hooks]
# Optionally enable formatting on generated revisions (disabled by default).
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
