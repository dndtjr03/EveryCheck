# 다봐드림(teogeo) 리버스 프록시 — 백엔드(FastAPI) + 정적 파일 분기
# SSL 인증서는 호스트에서 ./certs 를 마운트한 뒤 아래 443 블록의 경로를 맞춘다.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    upstream teogeo_backend {
        server web:8000;
        keepalive 32;
    }

    # ---- HTTP (80) — 정적 리소스는 /static/, 그 외는 API 백엔드 ----
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 10M;

        location ^~ /static/ {
            alias /var/www/static/;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
        }

        # API·OpenAPI·Swagger — 백엔드(web:8000)로 전달 (경로 명시로 디버깅 용이)
        location = /openapi.json {
            proxy_pass http://teogeo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # /docs: 백엔드가 보낸 Content-Security-Policy 를 Nginx 가 덮어쓰지 않음
        # (이 블록에 add_header Content-Security-Policy 를 두지 않음)
        # proxy_hide_header 로 CSP 를 숨기지 않음 — 기본적으로 업스트림 헤더 전달
        location ^~ /docs {
            proxy_pass http://teogeo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_pass_header Content-Security-Policy;
        }

        location / {
            proxy_pass http://teogeo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        # 운영 시 아래 주석을 해제하면 HTTP → HTTPS 리다이렉트
        # return 301 https://$host$request_uri;
    }

    # ---- HTTPS (443) 뼈대 — 인증서 배포 후 주석 해제 및 경로 수정 ----
